<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RPG Text Editor</title>
    <link rel="stylesheet" href="/editor/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <h1>RPG Text Editor</h1>
          <p>Editor Markdown con componenti TTRPG guidati da schema.</p>
        </div>
        <div class="topbar__actions" aria-label="Azioni documento">
          <button id="new-document" type="button">Nuovo</button>
          <select id="document-picker" aria-label="Documenti salvati">
            <option value="">Apri documento</option>
          </select>
          <button id="copy-markdown" type="button">Copia Markdown</button>
          <button id="download-markdown" type="button">Scarica .md</button>
          <button id="save-document" type="button">Salva in docs</button>
        </div>
      </header>

      <main class="workspace">
        <aside class="component-panel" aria-label="Componenti">
          <div class="panel-header">
            <h2>Componenti</h2>
            <input id="component-search" type="search" placeholder="Cerca" autocomplete="off">
          </div>
          <div class="component-scroll">
            <section class="pack-panel" aria-label="Plugin pack">
              <h3>Plugin pack</h3>
              <div id="pack-list" class="pack-list"></div>
            </section>
            <div id="component-list" class="component-list"></div>
          </div>
        </aside>

        <section class="editor-panel" aria-label="Editor Markdown">
          <div class="panel-header">
            <h2>Markdown</h2>
            <span id="save-state" class="save-state">Bozza locale</span>
          </div>
          <div class="metadata-panel" aria-label="Metadati documento">
            <label>
              <span>Titolo</span>
              <input id="meta-title" data-meta="title" type="text">
            </label>
            <label>
              <span>Slug</span>
              <input id="meta-slug" data-meta="slug" type="text">
            </label>
            <label class="metadata-wide">
              <span>Summary</span>
              <input id="meta-summary" data-meta="summary" type="text">
            </label>
            <label>
              <span>Categoria</span>
              <input id="meta-category" data-meta="category" type="text">
            </label>
            <label>
              <span>Tags</span>
              <input id="meta-tags" data-meta="tags" type="text">
            </label>
            <label>
              <span>Autore</span>
              <input id="meta-author" data-meta="author" type="text">
            </label>
            <label>
              <span>Tema</span>
              <select id="meta-theme" data-meta="theme">
                <option value="classic-parchment">classic-parchment</option>
                <option value="dark-arcane">dark-arcane</option>
                <option value="clean-guild">clean-guild</option>
                <option value="printer-friendly">printer-friendly</option>
              </select>
            </label>
            <label>
              <span>Carta</span>
              <select id="meta-paper" data-meta="paper">
                <option value="A4">A4</option>
                <option value="Letter">Letter</option>
              </select>
            </label>
            <label>
              <span>Pubblico</span>
              <select id="meta-public" data-meta="public">
                <option value="true">true</option>
                <option value="false">false</option>
              </select>
            </label>
          </div>
          <div class="editor-toolbar" aria-label="Toolbar Markdown">
            <button type="button" data-action="heading">H2</button>
            <button type="button" data-action="bold">B</button>
            <button type="button" data-action="italic">I</button>
            <button type="button" data-action="list">Lista</button>
            <button type="button" data-action="readaloud">Readaloud</button>
            <button type="button" data-action="pagebreak">Pagina</button>
          </div>
          <textarea id="markdown-input" spellcheck="true"></textarea>
        </section>

        <section class="preview-panel" aria-label="Anteprima">
          <div class="panel-header">
            <h2>Preview</h2>
            <span id="word-count" class="save-state">0 parole</span>
          </div>
          <div class="preview-stack">
            <aside id="validation-panel" class="validation-panel" aria-live="polite"></aside>
            <article id="preview" class="preview-document"></article>
          </div>
        </section>
      </main>
    </div>

    <dialog id="component-dialog" class="component-dialog">
      <form method="dialog">
        <header class="dialog-header">
          <div>
            <h2 id="dialog-title">Componente</h2>
            <p id="dialog-description"></p>
          </div>
          <button value="cancel" class="icon-button" type="submit" aria-label="Chiudi">×</button>
        </header>
        <div id="component-form" class="component-form"></div>
        <footer class="dialog-actions">
          <button value="cancel" type="submit">Annulla</button>
          <button id="insert-component" value="default" type="button">Inserisci</button>
        </footer>
      </form>
    </dialog>

    <script type="module" src="/editor/app.js"></script>
  </body>
</html>
